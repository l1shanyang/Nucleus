openapi: "3.0.3"
info:
  title: Nucleus API
  description: Nucleus 后端骨架 API。notes 仅用于演示 API 和分层写法。
  version: "0.1.0"

servers:
  - url: http://localhost:8080
    description: 本地开发

paths:
  /healthz:
    get:
      summary: 存活探针
      tags: [运维]
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: 就绪探针
      tags: [运维]
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /version:
    get:
      summary: 构建版本信息
      tags: [运维]
      responses:
        "200":
          description: 当前运行版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/notes:
    post:
      summary: 创建笔记
      tags: [笔记]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDataResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: 查询笔记列表
      tags: [笔记]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 偏移量
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    CreateNoteRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 200
          example: "First Note"
        body:
          type: string
          example: "Hello Nucleus"

    Note:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "First Note"
        body:
          type: string
          example: "Hello Nucleus"
        created_at:
          type: string
          format: date-time

    NoteDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Note"

    NoteListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    PaginationMeta:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0

    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        database:
          type: string
          enum: [ok, unavailable]

    VersionResponse:
      type: object
      required: [version, commit, build_time, go_version]
      properties:
        version:
          type: string
          example: "0.1.0"
        commit:
          type: string
          example: "abc1234"
        build_time:
          type: string
          example: "2026-06-04T10:00:00Z"
        go_version:
          type: string
          example: "go1.26.4"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: "invalid json body"
