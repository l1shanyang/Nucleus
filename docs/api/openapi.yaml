openapi: "3.0.3"
info:
  title: Nucleus API
  description: Nucleus 后端骨架 API。notes 仅用于演示 API 和分层写法。
  version: "0.1.0"

servers:
  - url: http://localhost:8080
    description: 本地开发

paths:
  /healthz:
    get:
      summary: 存活探针
      tags: [运维]
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /readyz:
    get:
      summary: 就绪探针
      tags: [运维]
      responses:
        "200":
          description: 服务就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
        "503":
          description: 服务未就绪
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"

  /version:
    get:
      summary: 构建版本信息
      tags: [运维]
      responses:
        "200":
          description: 当前运行版本
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /api/v1/auth/register:
    post:
      summary: 用户注册
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 邮箱已存在
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/auth/login:
    post:
      summary: 用户登录
      tags: [认证]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenDataResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 邮箱或密码错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/me:
    get:
      summary: 当前用户信息
      tags: [认证]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDataResponse"
        "401":
          description: 未认证或 token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces:
    post:
      summary: 创建 Workspace
      tags: [Workspace]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: 创建成功，当前用户自动成为 owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDataResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未认证或 token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: 查询当前用户的 Workspace 列表
      tags: [Workspace]
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceListDataResponse"
        "401":
          description: 未认证或 token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/workspaces/{workspaceID}:
    get:
      summary: 查询当前用户可访问的 Workspace 详情
      tags: [Workspace]
      security:
        - BearerAuth: []
      parameters:
        - name: workspaceID
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
          description: Workspace ID
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceDataResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 未认证或 token 无效
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Workspace 不存在或当前用户无成员身份
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/notes:
    post:
      summary: 创建笔记
      tags: [笔记]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNoteRequest"
      responses:
        "201":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteDataResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: 查询笔记列表
      tags: [笔记]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
          description: 每页条数
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: 偏移量
      responses:
        "200":
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoteListResponse"
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: 内部错误
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    RegisterRequest:
      type: object
      required: [email, name, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: "user@example.com"
        name:
          type: string
          maxLength: 100
          example: "Alice"
        password:
          type: string
          minLength: 8
          maxLength: 72
          writeOnly: true
          example: "password123"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
          example: "user@example.com"
        password:
          type: string
          writeOnly: true
          example: "password123"

    User:
      type: object
      required: [id, email, name, created_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        email:
          type: string
          format: email
          example: "user@example.com"
        name:
          type: string
          example: "Alice"
        created_at:
          type: string
          format: date-time

    UserDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/User"

    AuthToken:
      type: object
      required: [access_token, token_type, expires_at, user]
      properties:
        access_token:
          type: string
          example: "RZwnGdijxJ4Y2U2qKQrGec-OMe4c0vmp0b2yTbVB5YY"
        token_type:
          type: string
          enum: [Bearer]
          example: "Bearer"
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    AuthTokenDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/AuthToken"

    CreateWorkspaceRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 100
          example: "Support Team"

    Workspace:
      type: object
      required: [id, name, role, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Support Team"
        role:
          type: string
          enum: [owner, admin, agent, viewer]
          example: owner
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    WorkspaceDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Workspace"

    WorkspaceListDataResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"

    CreateNoteRequest:
      type: object
      required: [title, body]
      properties:
        title:
          type: string
          maxLength: 200
          example: "First Note"
        body:
          type: string
          example: "Hello Nucleus"

    Note:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: "First Note"
        body:
          type: string
          example: "Hello Nucleus"
        created_at:
          type: string
          format: date-time

    NoteDataResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Note"

    NoteListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Note"
        meta:
          $ref: "#/components/schemas/PaginationMeta"

    PaginationMeta:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        offset:
          type: integer
          minimum: 0
          example: 0

    ReadyResponse:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, not_ready]
        database:
          type: string
          enum: [ok, unavailable]

    VersionResponse:
      type: object
      required: [version, commit, build_time, go_version]
      properties:
        version:
          type: string
          example: "0.1.0"
        commit:
          type: string
          example: "abc1234"
        build_time:
          type: string
          example: "2026-06-04T10:00:00Z"
        go_version:
          type: string
          example: "go1.26.4"

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"

    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: "invalid json body"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
